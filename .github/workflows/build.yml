name: Build Patched mint-notag

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Build ALL upstream releases, oldest to newest'
        type: boolean
        default: false
      tag:
        description: 'Build one specific upstream tag (optional)'
        required: false
        default: ''

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.check.outputs.tags }}
      newest: ${{ steps.check.outputs.newest }}

    steps:
      - name: Work out which tags to build
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BACKFILL: ${{ inputs.backfill }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UP="https://api.github.com/repos/Strappazzon/drg-mint-notag/releases"
          AUTH="Authorization: Bearer $GH_TOKEN"
          NEWEST=$(curl -s -H "$AUTH" "$UP/latest" | jq -r '.tag_name')

          if [ -n "$INPUT_TAG" ]; then
            TAGS=$(jq -cn --arg t "$INPUT_TAG" '[$t]')
          elif [ "$BACKFILL" = "true" ]; then
            TAGS=$(curl -s -H "$AUTH" "$UP?per_page=100" \
              | jq -c '[.[] | select(.draft == false)] | sort_by(.published_at) | map(.tag_name)')
          else
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$NEWEST")
            if [ "$CODE" = "200" ]; then
              TAGS='[]'
            else
              TAGS=$(jq -cn --arg t "$NEWEST" '[$t]')
            fi
          fi

          echo "Newest upstream: $NEWEST"
          echo "Building: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "newest=$NEWEST" >> $GITHUB_OUTPUT

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.tags != '[]'
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time so releases are created oldest -> newest
      matrix:
        tag: ${{ fromJson(needs.check-and-build.outputs.tags) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download upstream source
        shell: pwsh
        run: |
          $tag = "${{ matrix.tag }}"
          $url = "https://github.com/Strappazzon/drg-mint-notag/archive/refs/tags/$tag.zip"
          Invoke-WebRequest -Uri $url -OutFile source.zip
          Expand-Archive -Path source.zip -DestinationPath staging
          $extracted = Get-ChildItem -Path staging -Directory | Select-Object -First 1
          Get-ChildItem $extracted.FullName | ForEach-Object {
            $dest = Join-Path "." $_.Name
            if (-not (Test-Path $dest)) {
              Move-Item $_.FullName -Destination .
            } else {
              Write-Host "Skipping existing: $($_.Name)"
            }
          }
          Remove-Item staging -Recurse
          Remove-Item source.zip

      - name: Apply patches
        shell: bash
        run: |
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.md" \) \
            -exec sed -i 's/mods_P\.pak/FSD-WindowsNoEditor099.pak/g' {} +

          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.md" \) \
            -exec sed -i 's|https://github.com/Strappazzon/drg-mint-notag|https://github.com/un-readable/drg-mint-notag-bypass|g' {} +

          find . -type f -name "*.rs" \
            -exec sed -i 's|api.github.com/repos/Strappazzon/drg-mint-notag|api.github.com/repos/un-readable/drg-mint-notag-bypass|g' {} +

          printf '[toolchain]\nchannel = "nightly-2024-02-01"\n' > rust-toolchain.toml

          UPSTREAM_VERSION="${{ matrix.tag }}"
          VERSION="${UPSTREAM_VERSION#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Version set to: $VERSION"

          echo "Verifying..."
          grep -r "Strappazzon" --include="*.rs" . && echo "WARNING: Strappazzon refs remain" || echo "All clear"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2024-02-01
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build
        shell: bash
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/mint.exe mint.exe
          FILES="mint.exe"
          for f in oo2core_9_win64.dll CHANGELOG.md LICENSE.txt; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          7z a dist/mint-x86_64-pc-windows-msvc.zip $FILES

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${{ matrix.tag }}"
          curl -s "https://api.github.com/repos/Strappazzon/drg-mint-notag/releases/tags/$TAG" \
            | jq -r '.body // ""' > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ---
          > **Patched build** — auto-built from upstream [$TAG](https://github.com/Strappazzon/drg-mint-notag/releases/tag/$TAG)
          > Patch applied: \`mods_P.pak\` → \`FSD-WindowsNoEditor099.pak\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: mint-notag-bypass ${{ matrix.tag }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: ${{ matrix.tag == needs.check-and-build.outputs.newest }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
