name: Build Patched mint-notag

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Build ALL upstream releases from v0.3.0 up, oldest to newest'
        type: boolean
        default: false
      tag:
        description: 'Build one specific upstream tag (optional)'
        required: false
        default: ''
      toolchain:
        description: 'Rust nightly to build with'
        required: false
        default: 'nightly-2024-02-01'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.check.outputs.tags }}
      newest: ${{ steps.check.outputs.newest }}

    steps:
      - name: Work out which tags to build
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BACKFILL: ${{ inputs.backfill }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UP="https://api.github.com/repos/Strappazzon/drg-mint-notag/releases"
          AUTH="Authorization: Bearer $GH_TOKEN"
          NEWEST=$(curl -s -H "$AUTH" "$UP/latest" | jq -r '.tag_name')

          if [ -n "$INPUT_TAG" ]; then
            TAGS=$(jq -cn --arg t "$INPUT_TAG" '[$t]')
          elif [ "$BACKFILL" = "true" ]; then
            # only tags >= v0.3.0 (older ones need a 2023 toolchain + 2023 lockfile)
            TAGS=$(curl -s -H "$AUTH" "$UP?per_page=100" | jq -c '
              [ .[]
                | select(.draft == false)
                | select((try (.tag_name | ltrimstr("v") | split(".") | map(tonumber)) catch [0]) >= [0,3,0])
              ] | sort_by(.published_at) | map(.tag_name)')
          else
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$NEWEST")
            if [ "$CODE" = "200" ]; then
              TAGS='[]'
            else
              TAGS=$(jq -cn --arg t "$NEWEST" '[$t]')
            fi
          fi

          echo "Newest upstream: $NEWEST"
          echo "Building: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "newest=$NEWEST" >> $GITHUB_OUTPUT

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.tags != '[]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time so releases are created oldest -> newest
      matrix:
        tag: ${{ fromJson(needs.check-and-build.outputs.tags) }}
        target: [x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu]
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            rust_targets: x86_64-pc-windows-msvc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc-mingw-w64 libgtk-3-dev

      - name: Download upstream source
        shell: bash
        run: |
          TAG="${{ matrix.tag }}"

          # keep the Oodle DLL from this repo (the tag's source doesn't ship it)
          mkdir -p "$RUNNER_TEMP/keep"
          [ -f oo2core_9_win64.dll ] && cp oo2core_9_win64.dll "$RUNNER_TEMP/keep/"

          curl -sSL -o "$RUNNER_TEMP/source.zip" \
            "https://github.com/Strappazzon/drg-mint-notag/archive/refs/tags/$TAG.zip"
          rm -rf "$RUNNER_TEMP/staging"
          7z x "$RUNNER_TEMP/source.zip" -o"$RUNNER_TEMP/staging" -y > /dev/null

          # wipe the checked-out files (keep .git) so the tag's source fully replaces them
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -R "$RUNNER_TEMP"/staging/*/. .
          chmod -R u+w .

          # restore the DLL, or fetch it from the upstream commit if it wasn't in this repo
          if [ -f "$RUNNER_TEMP/keep/oo2core_9_win64.dll" ]; then
            cp "$RUNNER_TEMP/keep/oo2core_9_win64.dll" .
          elif [ ! -f oo2core_9_win64.dll ]; then
            curl -sSLf -o oo2core_9_win64.dll \
              "https://raw.githubusercontent.com/Strappazzon/drg-mint-notag/1e519bf069d519c3614737c2c8a542138c5246f0/oo2core_9_win64.dll" \
              || echo "WARNING: could not get oo2core_9_win64.dll"
          fi
          ls

      - name: Apply patches
        shell: bash
        run: |
          # Patch 1: replace pak filename
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.md" \) \
            -exec sed -i 's/mods_P\.pak/FSD-WindowsNoEditor099.pak/g' {} +

          # Patch 2: replace all github.com repo links
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.md" \) \
            -exec sed -i 's|https://github.com/Strappazzon/drg-mint-notag|https://github.com/un-readable/drg-mint-notag-bypass|g' {} +

          # Patch 3: replace the api.github.com update check URL
          find . -type f -name "*.rs" \
            -exec sed -i 's|api.github.com/repos/Strappazzon/drg-mint-notag|api.github.com/repos/un-readable/drg-mint-notag-bypass|g' {} +

          # Patch 4: override toolchain to nightly for bindeps support
          TOOLCHAIN="${{ inputs.toolchain || 'nightly-2024-02-01' }}"
          printf '[toolchain]\nchannel = "%s"\n' "$TOOLCHAIN" > rust-toolchain.toml

          # Patch 5: update version to match upstream tag
          UPSTREAM_VERSION="${{ matrix.tag }}"
          VERSION="${UPSTREAM_VERSION#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Version set to: $VERSION"

          echo "Verifying..."
          grep -r "Strappazzon" --include="*.rs" . && echo "WARNING: Strappazzon refs remain" || echo "All clear"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ inputs.toolchain || 'nightly-2024-02-01' }}
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install cargo-dist (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.0.7/cargo-dist-installer.sh | sh

      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.0.7/cargo-dist-installer.ps1 | iex

      - name: Build with cargo-dist
        shell: bash
        run: |
          if ! cargo dist build --tag="${{ matrix.tag }}" --output-format=json \
              --artifacts=local --target=${{ matrix.target }} > dist-manifest.json; then
            echo "cargo-dist failed. Re-running plain cargo build to show the real error:"
            cargo build --profile dist --target ${{ matrix.target }} 2>&1 | tail -n 80 || true
            exit 1
          fi

          mkdir -p dist
          jq -r '.artifacts[]?.path | select(. != null)' dist-manifest.json | tr -d '\r' | while read -r p; do
            p=$(echo "$p" | tr '\\' '/')
            echo "Collecting $p"
            cp "$p" dist/
          done
          ls -la dist

      - name: Add Oodle DLL to Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f oo2core_9_win64.dll ]; then
            echo "ERROR: oo2core_9_win64.dll not found in workspace"
            exit 1
          fi

          ZIP=$(ls dist/*windows-msvc*.zip | head -n1)
          echo "Zip: $ZIP"

          # find where mint.exe lives inside the zip (root or a wrapper folder)
          EXE=$(7z l -slt "$ZIP" | tr -d '\r' | sed -n 's/^Path = //p' | grep -i 'mint\.exe$' | head -n1)
          DIR=$(dirname "$EXE")
          echo "mint.exe is at: $EXE"

          mkdir -p "$RUNNER_TEMP/zipfix/$DIR"
          cp oo2core_9_win64.dll "$RUNNER_TEMP/zipfix/$DIR/"
          ZIPABS="$(pwd)/$ZIP"
          (cd "$RUNNER_TEMP/zipfix" && 7z a "$ZIPABS" "$DIR/oo2core_9_win64.dll")

          echo "Final contents:"
          7z l "$ZIP"

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${{ matrix.tag }}"
          curl -s "https://api.github.com/repos/Strappazzon/drg-mint-notag/releases/tags/$TAG" \
            | jq -r '.body // ""' > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ---
          > **Patched build** — auto-built from upstream [$TAG](https://github.com/Strappazzon/drg-mint-notag/releases/tag/$TAG)
          > Patch applied: \`mods_P.pak\` → \`FSD-WindowsNoEditor099.pak\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: mint-notag-bypass ${{ matrix.tag }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: ${{ matrix.tag == needs.check-and-build.outputs.newest }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
